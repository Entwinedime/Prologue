[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "prologue-collection"
version = "0.0.0"
requires-python = ">=3.10"
description = "Native inference observations for Prologue"

[project.entry-points."sglang.srt.plugins"]
prologue = "prologue.app.sglang_plugin:install"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "prologue",
    "prologue.acquisition",
    "prologue.acquisition.observation",
    "prologue.app",
    "prologue.contracts",
    "prologue.contracts.workload",
    "prologue.integrations",
    "prologue.integrations.frameworks",
    "prologue.integrations.frameworks.sglang",
    "prologue.integrations.frameworks.sglang.observation",
    "prologue.integrations.frameworks.sglang.observation.local",
    "prologue.integrations.frameworks.sglang.shared",
    "prologue.integrations.platforms",
    "prologue.integrations.platforms.ascend",
    "prologue.integrations.platforms.ascend.analysis",
    "prologue.integrations.platforms.ascend.runtime",
    "prologue.integrations.runtimes",
    "prologue.integrations.runtimes.pytorch",
    "prologue.performance",
    "prologue.runtime",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.package-data]
"prologue.performance" = ["families.json"]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "prologue-collection"
version = "0.0.0"
requires-python = ">=3.10"
description = "Serving execution prediction, evidence acquisition and verification"

[project.scripts]
prologue-cli = "prologue.host.cli.cli:main"

[project.entry-points."sglang.srt.plugins"]
prologue = "prologue.workers.plugin:install"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["prologue", "prologue.*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.data-files]
"share/prologue" = ["src/shared/cost_families.json"]
